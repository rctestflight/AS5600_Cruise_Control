[platformio]
src_dir = .

[env:nanoatmega328new]
platform  = atmelavr
board     = nanoatmega328new
framework = arduino

; Serial monitor baud rate (matches Serial.begin(115200) in sketch)
monitor_speed = 115200

; Optional: auto-detect upload port, or set explicitly:
; upload_port = COM3

lib_deps = arduino-libraries/Servo @ ^1.2.2
